[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-a2a-agent"
version = "0.1.0"
description = "A minimal A2A agent server and HTTP client demo"
requires-python = ">=3.10"
dependencies = [
    "a2a-sdk[fastapi,http-server]>=1.3,<2",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
py-modules = ["server", "client"]
